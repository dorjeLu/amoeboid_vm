# cargo-deny: the crate set is pinned (design §Dependencies). A crate entering the graph,
# directly or transitively, is a reviewed change to this file.

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow = [
    # workspace
    "amoeboid",
    "amoeboid-cli",
    # §Dependencies
    "kdl",
    "lexopt",
    "proptest",
    "rustix",
    "serde",
    "serde_json",
    "thiserror",
    "tokio",
    # transitive, via the crates above
    "autocfg",
    "bit-set",
    "bit-vec",
    "bitflags",
    "bytes",
    "cfg-if",
    "chacha20",
    "core_detect",
    "cpufeatures",
    "errno",
    "fastrand",
    "fnv",
    "getrandom",
    "itoa",
    "libc",
    "linux-raw-sys",
    "memchr",
    "miette",
    "mio",
    "num-traits",
    "once_cell",
    "pin-project-lite",
    "proc-macro2",
    "quick-error",
    "quote",
    "rand",
    "rand_core",
    "rand_xorshift",
    "regex-syntax",
    "rusty-fork",
    "serde_core",
    "serde_derive",
    "signal-hook-registry",
    "socket2",
    "syn",
    "tempfile",
    "thiserror-impl",
    "tokio-macros",
    "unarray",
    "unicode-ident",
    "unicode-width",
    "wait-timeout",
    "winnow",
    "zmij",
]
