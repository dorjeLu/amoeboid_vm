[project]
name = "amoeboid"
version = "0.1.0"
description = "NixOS microVMs for letting agents loose on host directories"
requires-python = ">=3.14"
dependencies = ["ckdl>=1.0"]

[project.scripts]
amoeboid = "amoeboid.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.140", "basedpyright>=1.30", "ruff>=0.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PTH", "TRY", "C4"]
ignore = ["PLR0911", "PLR0913", "PLR2004", "TRY003", "TRY300"]

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests", "amoeboid.py"]
stubPath = "typings"
