[tools]
python = "3.14"
uv = "0.13"

[tasks.sync]
description = "Create/refresh the project venv"
run = "uv sync"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

[tasks.lint]
description = "Lint, check formatting, type-check"
run = [
  "uv run ruff check",
  "uv run ruff format --check",
  "uv run basedpyright",
]

[tasks.fmt]
description = "Apply formatting and autofixes"
run = ["uv run ruff check --fix", "uv run ruff format"]

[tasks.install]
description = "Install the `amoeboid` command (editable, tracks this checkout)"
run = "uv tool install --editable --force ."

[tasks.test-thorough]
description = "Run the test suite with many more property-test examples"
env = { HYPOTHESIS_PROFILE = "thorough" }
run = "uv run pytest"
